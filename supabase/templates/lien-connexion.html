<div style="background:#f6f1e6;padding:32px 16px;font-family:Arial,Helvetica,sans-serif;color:#1b1a17">
  <div style="max-width:480px;margin:0 auto;background:#fcfaf4;border:1px solid #d6ccb6;border-radius:8px;padding:28px 24px">
    <p style="margin:0 0 20px;font-size:20px;font-weight:bold">Fantômes</p>
    <p style="margin:0 0 16px;font-size:16px;line-height:1.5">Voici ton code de connexion :</p>
    <p style="margin:0 0 20px;font-family:'Courier New',monospace;font-size:32px;font-weight:bold;letter-spacing:6px;background:#ffd84a;display:inline-block;padding:6px 12px;border-radius:4px">{{ .Token }}</p>
    <p style="margin:0 0 16px;font-size:16px;line-height:1.5">Tape-le sur la page de connexion, ou clique directement sur ce bouton :</p>
    <p style="margin:0 0 24px">
      <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=email" style="display:inline-block;background:#1b1a17;color:#f6f1e6;text-decoration:none;font-weight:bold;font-size:16px;padding:14px 22px;border-radius:10px">Me connecter</a>
    </p>
    <p style="margin:0;font-size:13px;line-height:1.5;color:#6e685e">Ce code est valable une heure. Si tu n'as rien demandé, ignore simplement cet email : ton compte reste protégé.</p>
  </div>
</div>
